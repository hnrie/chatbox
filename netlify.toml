[build]
  command   = "pnpm run build:web-only"
  publish   = "dist/web"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9"

# Netlify Edge / Functions not needed – this is a pure static SPA.
# All unknown routes are served the SPA shell so TanStack Router can handle them.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security + cross-origin isolation headers for all responses.
# COOP + COEP enable window.crossOriginIsolated = true, which is required
# for SharedArrayBuffer (used by the WASM Knowledge Base worker).
# COEP=credentialless (Chrome 96+/Firefox 119+) allows cross-origin resources
# without requiring them to opt-in via Cross-Origin-Resource-Policy headers,
# making it compatible with Google Analytics, Sentry, and other third-party scripts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options                = "DENY"
    X-Content-Type-Options         = "nosniff"
    X-XSS-Protection               = "1; mode=block"
    Referrer-Policy                = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy     = "same-origin"
    Cross-Origin-Embedder-Policy   = "credentialless"

# Long-lived cache for content-hashed static assets.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
